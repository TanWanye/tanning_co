services:
  - type: web
    name: tanning-co
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: cd backend && python main.py
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # First manager account. Set these in the Render dashboard (never commit them).
      # They're only used when there are no staff accounts yet.
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
    # Once the service is on a paid instance type, uncomment these so data survives deploys
    # (and add DATABASE_PATH=/var/data/glowboard.db under envVars):
    # disk:
    #   name: tanning-data
    #   mountPath: /var/data
    #   sizeGB: 1
